name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "develop"
      - "feature/**"
    tags-ignore:
      - "**"
    paths-ignore:
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  fmt-clippy:
    name: fmt-clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup update stable
      - run: sudo apt-get update && sudo apt-get install -y build-essential nasm
      - uses: shiguredo/github-actions/.github/actions/rust-cache@091812b41cd7c5f2b5818d4fde613f93bf0c93b1 # main
        with:
          os: ubuntu-24.04
          toolchain: stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features source-build -- -D warnings

  test:
    name: ${{ matrix.os }}
    needs: fmt-clippy
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
          - os: ubuntu-26.04-arm
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
          - os: macos-26
          - os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup update stable
      - name: Install build dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm
      - uses: shiguredo/github-actions/.github/actions/rust-cache@091812b41cd7c5f2b5818d4fde613f93bf0c93b1 # main
        with:
          os: ${{ matrix.os }}
          toolchain: stable
      - run: cargo test --workspace --features source-build

  test-windows:
    name: windows-2025
    needs: fmt-clippy
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup update stable
      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - run: cargo test --workspace --features source-build

  # docs.rs 向けビルド確認
  docs-rs:
    name: docs.rs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCS_RS: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup update stable
      - run: cargo doc --no-deps

  slack_notify:
    needs:
      - fmt-clippy
      - test
      - test-windows
      - docs-rs
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@091812b41cd7c5f2b5818d4fde613f93bf0c93b1 # main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
