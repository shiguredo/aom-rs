name: Release

on:
  push:
    tags:
      - "*"

env:
  RUST_BACKTRACE: 1

jobs:
  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Check version matches Cargo.toml
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          # Cargo.toml の [package] セクションの version を読み取る。
          # package.metadata.external-dependencies.aom にも version があるため、
          # 1 段目の sed で [package] から次の [ セクションまでを範囲として抽出する。
          CARGO_VERSION=$(
            sed -n '/^\[package\]/,/^\[/p' Cargo.toml |
              sed -n 's/^version *= *"\(.*\)"/\1/p'
          )
          if [[ -z "$CARGO_VERSION" ]]; then
            echo "Failed to read version from Cargo.toml [package] section" >&2
            exit 1
          fi
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "Tag version ($VERSION) does not match Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if [[ "$VERSION" == *canary* ]]; then
            gh release create "$VERSION" \
              --prerelease \
              --title "$VERSION" \
              --notes "Release $VERSION"
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "Release $VERSION"
          fi

  build-prebuilt:
    name: "Build prebuilt (${{ matrix.target }})"
    needs: github-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-26.04_x86_64
            os: ubuntu-26.04
            rust_target: x86_64-unknown-linux-gnu
          - target: ubuntu-26.04_arm64
            os: ubuntu-26.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: ubuntu-24.04_x86_64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - target: ubuntu-24.04_arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: ubuntu-22.04_x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - target: ubuntu-22.04_arm64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: macos_arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake nasm

      - name: Build with source-build
        run: cargo build --release --features source-build

      - name: Find OUT_DIR
        id: find_out_dir
        run: |
          OUT_DIR=$(find target/release/build/shiguredo_aom-*/out -maxdepth 0 -type d 2>/dev/null | head -1)
          echo "OUT_DIR=${OUT_DIR}" >> $GITHUB_OUTPUT

      - name: Create prebuilt archive
        run: |
          mkdir -p staging/lib
          cp ${{ steps.find_out_dir.outputs.OUT_DIR }}/lib/libaom.a staging/lib/
          cp ${{ steps.find_out_dir.outputs.OUT_DIR }}/bindings.rs staging/
          tar czf libaom-${{ matrix.target }}.tar.gz -C staging .

      - name: Generate SHA256 checksum
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum libaom-${{ matrix.target }}.tar.gz > libaom-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 libaom-${{ matrix.target }}.tar.gz > libaom-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload prebuilt archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.github-release.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          gh release upload "$VERSION" \
            "libaom-${TARGET}.tar.gz" \
            "libaom-${TARGET}.tar.gz.sha256" \
            --clobber

  build-prebuilt-windows:
    name: "Build prebuilt (windows_x86_64)"
    needs: github-release
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: rustup update stable

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build with source-build
        run: cargo build --release --features source-build

      - name: Find OUT_DIR and create prebuilt archive
        shell: pwsh
        run: |
          $outDir = (Get-ChildItem -Path "target/release/build/shiguredo_aom-*/out" -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path staging/lib
          Copy-Item "$outDir/lib/aom.lib" staging/lib/
          Copy-Item "$outDir/bindings.rs" staging/
          tar czf libaom-windows_x86_64.tar.gz -C staging .

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 libaom-windows_x86_64.tar.gz).Hash.ToLower()
          "$hash  libaom-windows_x86_64.tar.gz" | Out-File -Encoding ascii -NoNewline libaom-windows_x86_64.tar.gz.sha256

      - name: Upload prebuilt archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.github-release.outputs.version }}
        run: |
          gh release upload "$env:VERSION" `
            libaom-windows_x86_64.tar.gz `
            libaom-windows_x86_64.tar.gz.sha256 `
            --clobber

  publish:
    needs: [github-release, build-prebuilt, build-prebuilt-windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  slack_notify:
    needs: [github-release, build-prebuilt, build-prebuilt-windows, publish]
    timeout-minutes: 5
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@091812b41cd7c5f2b5818d4fde613f93bf0c93b1 # main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
