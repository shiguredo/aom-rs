name: Release

on:
  push:
    tags:
      - "*"

env:
  RUST_BACKTRACE: 1

jobs:
  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ${{ contains(steps.get_version.outputs.VERSION, 'canary') }}; then
            gh release create ${{ steps.get_version.outputs.VERSION }} \
              --prerelease \
              --title "${{ steps.get_version.outputs.VERSION }}" \
              --notes "Release ${{ steps.get_version.outputs.VERSION }}"
          else
            gh release create ${{ steps.get_version.outputs.VERSION }} \
              --title "${{ steps.get_version.outputs.VERSION }}" \
              --notes "Release ${{ steps.get_version.outputs.VERSION }}"
          fi

  build-prebuilt:
    name: "Build prebuilt (${{ matrix.target }})"
    needs: github-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-24.04_x86_64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - target: ubuntu-24.04_arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: ubuntu-22.04_x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - target: ubuntu-22.04_arm64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: macos_arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake nasm

      - name: Build with source-build
        run: cargo build --release --features source-build

      - name: Find OUT_DIR
        id: find_out_dir
        run: |
          OUT_DIR=$(find target/release/build/shiguredo_aom-*/out -maxdepth 0 -type d 2>/dev/null | head -1)
          echo "OUT_DIR=${OUT_DIR}" >> $GITHUB_OUTPUT

      - name: Create prebuilt archive
        run: |
          mkdir -p staging/lib
          cp ${{ steps.find_out_dir.outputs.OUT_DIR }}/lib/libaom.a staging/lib/
          cp ${{ steps.find_out_dir.outputs.OUT_DIR }}/bindings.rs staging/
          tar czf libaom-${{ matrix.target }}.tar.gz -C staging .

      - name: Generate SHA256 checksum
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum libaom-${{ matrix.target }}.tar.gz > libaom-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 libaom-${{ matrix.target }}.tar.gz > libaom-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload prebuilt archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.github-release.outputs.version }} \
            libaom-${{ matrix.target }}.tar.gz \
            libaom-${{ matrix.target }}.tar.gz.sha256 \
            --clobber

  build-prebuilt-windows:
    name: "Build prebuilt (windows_x86_64)"
    needs: github-release
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: rustup update stable

      - name: Install NASM
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build with source-build
        run: cargo build --release --features source-build

      - name: Find OUT_DIR and create prebuilt archive
        shell: pwsh
        run: |
          $outDir = (Get-ChildItem -Path "target/release/build/shiguredo_aom-*/out" -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path staging/lib
          Copy-Item "$outDir/lib/aom.lib" staging/lib/
          Copy-Item "$outDir/bindings.rs" staging/
          tar czf libaom-windows_x86_64.tar.gz -C staging .

      - name: Generate SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 libaom-windows_x86_64.tar.gz).Hash.ToLower()
          "$hash  libaom-windows_x86_64.tar.gz" | Out-File -Encoding ascii -NoNewline libaom-windows_x86_64.tar.gz.sha256

      - name: Upload prebuilt archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.github-release.outputs.version }} `
            libaom-windows_x86_64.tar.gz `
            libaom-windows_x86_64.tar.gz.sha256 `
            --clobber

  publish:
    needs: [github-release, build-prebuilt, build-prebuilt-windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  slack_notify:
    needs: [github-release, build-prebuilt, build-prebuilt-windows, publish]
    timeout-minutes: 20
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
