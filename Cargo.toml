[package]
name = "shiguredo_aom"
version = "2026.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Shiguredo Inc."]
license = "Apache-2.0"
description = "Rust bindings for AOM (Alliance for Open Media) codec library"
homepage = "https://github.com/shiguredo/aom-rs"
repository = "https://github.com/shiguredo/aom-rs"
readme = "README.md"
build = "build.rs"
include = ["/src/**/*", "/build.rs", "/README.md", "/LICENSE"]

[features]
source-build = []

[dependencies]

[build-dependencies]
bindgen = "0.72"
shiguredo_cmake = "4.3"
shiguredo_toml = "2026.1"

# 以降は外部ライブラリビルド用のメタデータ
# (この内容は build.rs の中からのみ参照される)
[package.metadata.external-dependencies]
aom = { url = "https://aomedia.googlesource.com/aom", version = "v3.13.2" }
