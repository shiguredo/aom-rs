[package]
name = "shiguredo_aom"
version = "2026.2.0-canary.2"
edition = "2024"
rust-version = "1.93"
description = "Rust bindings for AOM (Alliance for Open Media) codec library"
readme = "README.md"
homepage = "https://github.com/shiguredo/aom-rs"
repository = "https://github.com/shiguredo/aom-rs"
license = "Apache-2.0"
build = "build.rs"
include = ["/LICENSE", "/README.md", "/build.rs", "/src/**/*"]

# 以降は外部ライブラリビルド用のメタデータ
# (この内容は build.rs の中からのみ参照される)
[package.metadata.external-dependencies.aom]
url = "https://aomedia.googlesource.com/aom"
version = "v3.14.1"

[workspace]
resolver = "2"
members = [".", "pbt"]

[dependencies]

[build-dependencies]
# libaom ヘッダから Rust FFI バインディングを生成する
bindgen = "0.72"
# libaom を CMake でビルドする
shiguredo_cmake = "4.3"
# package.metadata.external-dependencies を読む
shiguredo_toml = "2026.2"

[features]
source-build = []
